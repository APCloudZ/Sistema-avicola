# ============================================================
# Tema visual del Sistema Avícola
# ============================================================

[theme]
base = "dark"                         # tema oscuro (estilo "Liquid Glass")
primaryColor = "#5FD08A"              # verde brillante: color principal
backgroundColor = "#0C110E"           # fondo casi negro con tinte verde
secondaryBackgroundColor = "#18211B"  # fondo de cajas de texto y selectores
textColor = "#ECF2EC"                 # texto claro, buen contraste
borderColor = "#2C3830"               # bordes suaves
baseRadius = "12px"                   # esquinas redondeadas
# Tipografía Inter (se descarga de Google Fonts; si no hay internet,
# Streamlit usa automáticamente una letra sin serifa del sistema).
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

# Barra lateral: el efecto de vidrio se dibuja en estilos.css
[theme.sidebar]
backgroundColor = "#0C110E"
secondaryBackgroundColor = "#18211B"
textColor = "#ECF2EC"
primaryColor = "#5FD08A"
borderColor = "#2C3830"

[client]
# Oculta el menú de desarrollador (botón "Deploy", etc.)
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
